        #apply-btn { padding: 10px 20px; font-size: 1em; background-color: #4CAF50; color: #fff; border-radius: 4px; margin: 0; }

        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        th { background-color: #333; color: #f5a623; }
        .highlight { background-color: #ff9800 !important; color: #000; font-weight: bold; }
        .past { color: #777; }
        
        @keyframes flash {
            0%, 100% { background-color: #121212; }

        .flashing { animation: flash 1s infinite; }

            { type: "매일", time: "23:15", name: "클래식 200억 GTD", buyin: 110000000, regTime: "0:14" },
            { type: "매일", time: "23:15", name: "스텝업 터보 18억 GTD", buyin: 10000000, regTime: "23:43" },
            { type: "매일", time: "23:30", name: "클래식 70억 GTD", buyin: 45000000, regTime: "0:29" },
            { type: "매일", time: "23:30", name: "데일리 스페셜 500억 GTD", buyin: 300000000, regTime: "0:29" }
        ];

        let filteredSchedule = []; // 필터링된 배열
        let alarmEnabled = false;
        let lastAlarmedTime = "";

        // 시간 문자열 포맷팅
        function formatTimeStr(timeStr) {
            let [h, m] = timeStr.split(':');
            return `${h.padStart(2, '0')}:${m.padStart(2, '0')}`;
        }

        // 로컬 스토리지에 필터값 저장하기
        function saveFilters() {
            localStorage.setItem('alarmMinVal', document.getElementById('min-val').value);
            localStorage.setItem('alarmMinUnit', document.getElementById('min-unit').value);
            localStorage.setItem('alarmMaxVal', document.getElementById('max-val').value);
            localStorage.setItem('alarmMaxUnit', document.getElementById('max-unit').value);
        }

        // 로컬 스토리지에서 필터값 불러오기
        function loadFilters() {
            if (localStorage.getItem('alarmMinVal') !== null) {
                document.getElementById('min-val').value = localStorage.getItem('alarmMinVal');
            }
            if (localStorage.getItem('alarmMinUnit') !== null) {
                document.getElementById('min-unit').value = localStorage.getItem('alarmMinUnit');
            }
            
            // 최대 단위 옵션을 불러온 최소 단위에 맞게 갱신
            updateMaxUnitOptions();

            if (localStorage.getItem('alarmMaxVal') !== null) {
                document.getElementById('max-val').value = localStorage.getItem('alarmMaxVal');
            }
            if (localStorage.getItem('alarmMaxUnit') !== null) {
                // 불러온 최대 단위가 현재 존재하는 옵션에 있는지 확인 후 세팅
                const maxUnitEl = document.getElementById('max-unit');
                const savedMaxUnit = localStorage.getItem('alarmMaxUnit');
                if (maxUnitEl.querySelector(`option[value="${savedMaxUnit}"]`)) {
                    maxUnitEl.value = savedMaxUnit;
                }
            }
        }

        // ------------------ 추가된 기능: 최소 단위에 따른 최대 단위 동적 변경 ------------------
        function updateMaxUnitOptions() {
            const minUnitVal = document.getElementById('min-unit').value;
            const maxUnitEl = document.getElementById('max-unit');
            const currentMaxVal = maxUnitEl.value;

            // 기존 옵션 지우기
            maxUnitEl.innerHTML = '';

            // 최소 단위에 따라 추가할 옵션 결정
            if (minUnitVal === '1') {
                // '선택 안함' -> 모두 표시
                maxUnitEl.innerHTML += '<option value="1">선택 안함</option>';
                maxUnitEl.innerHTML += '<option value="10000">만</option>';
                maxUnitEl.innerHTML += '<option value="100000000">억</option>';
            } else if (minUnitVal === '10000') {
                // '만' -> '만', '억' 표시
                maxUnitEl.innerHTML += '<option value="10000">만</option>';
                maxUnitEl.innerHTML += '<option value="100000000">억</option>';
            } else if (minUnitVal === '100000000') {
                // '억' -> '억'만 표시
                maxUnitEl.innerHTML += '<option value="100000000">억</option>';
            }

            // 기존에 선택되어 있던 값이 새로 그려진 옵션에 있으면 유지, 없으면 첫 번째 옵션으로 초기화 (예: '억' 강제 고정)
            if (maxUnitEl.querySelector(`option[value="${currentMaxVal}"]`)) {
                maxUnitEl.value = currentMaxVal;
            } else {
                maxUnitEl.value = maxUnitEl.options[0].value;
            }
        }

        // 최소 단위 셀렉트박스가 바뀔 때마다 이벤트 실행
        document.getElementById('min-unit').addEventListener('change', updateMaxUnitOptions);
        // ---------------------------------------------------------------------------------

        // 바이인 기반 필터링 적용 함수
        function applyFilter() {
            const today = new Date().getDay();
            const isWeekend = (today === 0 || today === 6);

            // 입력값 계산
            let minInput = parseFloat(document.getElementById('min-val').value);
            let minUnit = parseFloat(document.getElementById('min-unit').value);
            let minBuyin = isNaN(minInput) ? 0 : minInput * minUnit;

            let maxInput = parseFloat(document.getElementById('max-val').value);
            let maxUnit = parseFloat(document.getElementById('max-unit').value);
            let maxBuyin = isNaN(maxInput) ? Infinity : maxInput * maxUnit;

            filteredSchedule = rawSchedule.filter(item => {
                // 요일 필터 (평일/주말)
                if (item.type === "평일" && isWeekend) return false;
                if (item.type === "주말" && !isWeekend) return false;

                // 바이인 필터
                if (item.buyin < minBuyin || item.buyin > maxBuyin) return false;

                return true;
            }).map(item => ({
                ...item,
                formattedRegTime: formatTimeStr(item.regTime)
            })).sort((a, b) => a.formattedRegTime.localeCompare(b.formattedRegTime));

            // 테이블 다시 그리기
            const now = new Date();
            const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            renderTable(currentTimeStr);
        }

        const tbody = document.getElementById('schedule-body');

        // 테이블 렌더링
        function renderTable(currentTimeStr) {
            tbody.innerHTML = '';
            
            if (filteredSchedule.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="color:#888; padding: 20px;">조건에 맞는 토너먼트가 없습니다.</td></tr>`;
                return;
            }

            filteredSchedule.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                
                if (item.formattedRegTime < currentTimeStr) {
                    tr.className = 'past';
                }

                tr.innerHTML = `
                    <td>${item.time}</td>
                    <td>${item.name}</td>
                    <td>${item.regTime}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 소리 알람 및 음성 합성
        function playAlarm(tournamentName) {
            if (!alarmEnabled) return;
            
            document.body.classList.add('flashing');
            setTimeout(() => document.body.classList.remove('flashing'), 5000);

            const utterance = new SpeechSynthesisUtterance(`${tournamentName}, 12비비 레지 시간입니다.`);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // 매초 업데이트 (알람 체크)
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const currentTimeStr = `${h}:${m}`;
            
            document.getElementById('time-display').textContent = `${h}:${m}:${s}`;

            let nextAlarmFound = false;
            
            // 필터링된 배열을 기준으로 알람 확인
            filteredSchedule.forEach((item, index) => {
                const row = document.getElementById(`row-${index}`);
                if (!row) return;

                if (item.formattedRegTime === currentTimeStr) {
                    row.className = 'highlight';
                    if (lastAlarmedTime !== currentTimeStr) {
                        playAlarm(item.name);
                        lastAlarmedTime = currentTimeStr;
                    }
                } else if (item.formattedRegTime > currentTimeStr) {
                    row.classList.remove('highlight');
                    if (!nextAlarmFound) {
                        document.getElementById('next-alarm').textContent = `다음 12BB 레지: [${item.regTime}] ${item.name}`;
                        nextAlarmFound = true;
                    }
                }
            });

            if (!nextAlarmFound) {
                document.getElementById('next-alarm').textContent = "오늘 조건에 맞는 남은 일정이 없습니다.";
            }
        }

        // 알람 켜기/끄기 토글 이벤트
        document.getElementById('toggle-btn').addEventListener('click', function() {
            alarmEnabled = !alarmEnabled;
            
            if (alarmEnabled) {
                this.textContent = "알람 끄기 (현재 작동 중)";
                this.classList.add('active');
                
                const dummyUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(dummyUtterance);
            } else {
                this.textContent = "알람 켜기 (현재 꺼짐)";
                this.classList.remove('active');
                
                window.speechSynthesis.cancel();
                document.body.classList.remove('flashing');
            }
        });

        // 필터 적용 버튼 이벤트
        document.getElementById('apply-btn').addEventListener('click', function() {
            saveFilters(); // 적용할 때마다 로컬 스토리지에 저장
            applyFilter();
            updateClock();
        });

        // 페이지 초기 로딩 시 동작
        loadFilters(); // 저장된 필터 불러오기 (이 안에서 updateMaxUnitOptions도 실행됨)
        applyFilter(); // 불러온 필터 적용
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
